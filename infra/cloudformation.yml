AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MOAI static website: private S3 bucket + CloudFront (Origin Access Control, HTTPS, HTTP/2+3,
  compression, security headers). Deploy this stack in us-east-1 if you attach an ACM certificate.

Parameters:
  DomainName:
    Type: String
    Default: ''
    Description: Optional custom domain (e.g. moai.ec). Leave empty to use the *.cloudfront.net URL.
  IncludeWww:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Also serve www.<DomainName> from the same distribution.
  AcmCertificateArn:
    Type: String
    Default: ''
    Description: ARN of an ACM certificate in us-east-1 covering the domain(s). Required when DomainName is set.

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, '']]
  HasWww: !And [!Condition HasDomain, !Equals [!Ref IncludeWww, 'true']]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} static site'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases: !If
          - HasDomain
          - !If
            - HasWww
            - [!Ref DomainName, !Sub 'www.${DomainName}']
            - [!Ref DomainName]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: s3-site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # AWS managed policies: CachingOptimized + SecurityHeadersPolicy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  BucketName:
    Description: Use as S3_BUCKET in scripts/deploy.sh
    Value: !Ref SiteBucket
  DistributionId:
    Description: Use as CLOUDFRONT_DISTRIBUTION_ID in scripts/deploy.sh
    Value: !Ref Distribution
  DistributionDomainName:
    Description: Point your DNS (ALIAS/CNAME) at this hostname
    Value: !GetAtt Distribution.DomainName
